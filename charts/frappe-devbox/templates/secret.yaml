{{- if not .Values.auth.existingSecret }}
{{- $name := include "frappe-devbox.fullname" . }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
{{- /*
  Precedence: explicit value > value already in the cluster > new random one.
  Reusing the live value keeps the MariaDB root password stable across
  upgrades; MariaDB in the existing volume would reject a new one.
*/}}
{{- $siteAdmin := .Values.auth.siteAdminPassword | default (get $existing "SITE_ADMIN_PASSWORD" | b64dec) | default (randAlphaNum 24) }}
{{- $dbRoot := .Values.auth.dbRootPassword | default (get $existing "DB_ROOT_PASSWORD" | b64dec) | default (randAlphaNum 32) }}
{{- $codeServer := .Values.auth.codeServerPassword | default (get $existing "PASSWORD" | b64dec) | default (randAlphaNum 24) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "frappe-devbox.labels" . | nindent 4 }}
  {{- if .Values.persistence.keepOnUninstall }}
  annotations:
    # Kept with the PVC: the MariaDB data in it only accepts this password.
    helm.sh/resource-policy: keep
  {{- end }}
type: Opaque
data:
  SITE_ADMIN_PASSWORD: {{ $siteAdmin | b64enc | quote }}
  DB_ROOT_PASSWORD: {{ $dbRoot | b64enc | quote }}
  {{- if include "frappe-devbox.codeServerAuthOn" . }}
  PASSWORD: {{ $codeServer | b64enc | quote }}
  {{- end }}
{{- end }}
