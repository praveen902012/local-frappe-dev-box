apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "frappe-devbox.fullname" . }}
  labels:
    {{- include "frappe-devbox.labels" . | nindent 4 }}
spec:
  # One workspace per release: the volume is RWO and holds a MariaDB datadir.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "frappe-devbox.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Restart the pod when settings change.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "frappe-devbox.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        # First-boot build (bench init, yarn, assets, new-site) with the higher
        # bootstrap limits. The entrypoint bootstraps, then execs /bin/true.
        - name: bootstrap
          {{- include "frappe-devbox.containerCommon" . | nindent 10 }}
          args: ["/bin/true"]
          resources:
            {{- toYaml .Values.bootstrap.resources | nindent 12 }}
      containers:
        - name: devbox
          {{- include "frappe-devbox.containerCommon" . | nindent 10 }}
          ports:
            - name: web
              containerPort: 8000
            - name: socketio
              containerPort: 9000
            {{- if .Values.codeServer.enabled }}
            - name: code
              containerPort: 8080
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            tcpSocket:
              port: web
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /api/method/ping
              port: web
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
          livenessProbe:
            tcpSocket:
              port: web
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "frappe-devbox.claimName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
        # uv / yarn / npm caches; rebuilt on restart.
        - name: home
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
