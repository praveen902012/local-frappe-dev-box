[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[supervisord]
nodaemon=true
loglevel=info
logfile=/dev/null
pidfile=/run/supervisord.pid
user=root

[program:code-server]
priority=10
directory=%(ENV_BENCH_DIR)s
command=/bin/bash -lc 'exec "${CODE_SERVER_BIN:-/usr/bin/code-server}" --bind-addr "${CODE_SERVER_BIND_ADDR:-0.0.0.0:8080}" --auth "${CODE_SERVER_AUTH:-none}" "${BENCH_DIR:-/workspace/frappe-bench}"'
user=%(ENV_FRAPPE_USER)s
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=HOME="%(ENV_FRAPPE_HOME)s",USER="%(ENV_FRAPPE_USER)s",NVM_DIR="%(ENV_NVM_DIR)s"

[program:frappe]
priority=20
directory=%(ENV_BENCH_DIR)s
command=/bin/bash -lc 'cd "${BENCH_DIR}" && exec "${BENCH_CMD:-bench}" start'
user=%(ENV_FRAPPE_USER)s
autostart=true
autorestart=true
startsecs=10
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=HOME="%(ENV_FRAPPE_HOME)s",USER="%(ENV_FRAPPE_USER)s",NVM_DIR="%(ENV_NVM_DIR)s"
