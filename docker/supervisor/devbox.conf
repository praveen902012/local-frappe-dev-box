; Runs entirely as the image user (uid 1000). No root, no user switching.
; *_AUTOSTART variables are exported by entrypoint.sh from the ENABLE_* flags.

[unix_http_server]
file=%(ENV_RUN_DIR)s/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://%(ENV_RUN_DIR)s/supervisor.sock

[supervisord]
nodaemon=true
loglevel=info
logfile=/dev/null
logfile_maxbytes=0
pidfile=%(ENV_RUN_DIR)s/supervisord.pid

[program:mariadb]
priority=1
command=/usr/sbin/mariadbd
  --datadir=%(ENV_MARIADB_DATA_DIR)s
  --socket=%(ENV_RUN_DIR)s/mysqld.sock
  --pid-file=%(ENV_RUN_DIR)s/mysqld.pid
  --bind-address=127.0.0.1
  --port=%(ENV_DB_PORT)s
  --skip-name-resolve
  --character-set-server=utf8mb4
  --collation-server=utf8mb4_unicode_ci
autostart=%(ENV_MARIADB_AUTOSTART)s
autorestart=true
startsecs=5
stopsignal=TERM
stopwaitsecs=50
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:redis]
priority=2
command=/usr/bin/redis-server
  --bind 127.0.0.1
  --port 6379
  --protected-mode yes
  --dir %(ENV_REDIS_DATA_DIR)s
  --appendonly yes
  --daemonize no
autostart=%(ENV_REDIS_AUTOSTART)s
autorestart=true
startsecs=2
stopsignal=TERM
stopwaitsecs=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:code-server]
priority=10
directory=%(ENV_BENCH_DIR)s
command=%(ENV_CODE_SERVER_BIN)s
  --bind-addr %(ENV_CODE_SERVER_BIND_ADDR)s
  --auth %(ENV_CODE_SERVER_AUTH)s
  --user-data-dir %(ENV_CODE_SERVER_DATA_DIR)s/user-data
  --extensions-dir %(ENV_CODE_SERVER_DATA_DIR)s/extensions
  --disable-telemetry
  --disable-update-check
  %(ENV_BENCH_DIR)s
autostart=%(ENV_CODE_SERVER_AUTOSTART)s
autorestart=true
startsecs=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:frappe]
priority=20
directory=%(ENV_BENCH_DIR)s
command=/bin/bash -c 'exec "${BENCH_CMD:-bench}" start'
autostart=true
autorestart=true
startsecs=10
startretries=10
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
