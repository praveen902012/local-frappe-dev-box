{{- if .Values.ingress.enabled }}
{{- $fullname := include "frappe-devbox.fullname" . }}
{{- $exposeCode := and .Values.codeServer.enabled .Values.codeServer.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "frappe-devbox.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
        {{- if $exposeCode }}
        - {{ .Values.codeServer.ingress.host | quote }}
        {{- end }}
      secretName: {{ .Values.ingress.tls.secretName | default (printf "%s-tls" $fullname) }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # Realtime: bench serve does not proxy socket.io.
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}
                port:
                  name: socketio
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}
                port:
                  name: web
    {{- if $exposeCode }}
    - host: {{ .Values.codeServer.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}
                port:
                  name: code
    {{- end }}
{{- end }}
