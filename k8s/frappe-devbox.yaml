# Frappe v15 devbox on k3s with local-path storage.
# Passes Pod Security "restricted" (non-root, no capabilities, no privilege
# escalation, RuntimeDefault seccomp) and runs with a read-only root filesystem.
#
#   kubectl apply -f k8s/frappe-devbox.yaml
#   kubectl -n frappe-staging logs -f deploy/frappe-devbox -c bootstrap   # first boot: 15-30 min
#   kubectl -n frappe-staging logs -f deploy/frappe-devbox                # afterwards
#   kubectl -n frappe-staging port-forward deploy/frappe-devbox 8080:8080   # code-server
#
# Change before applying: the image, the three Secret values, the Ingress host.
---
apiVersion: v1
kind: Namespace
metadata:
  name: frappe-staging
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: Secret
metadata:
  name: frappe-devbox
  namespace: frappe-staging
type: Opaque
stringData:
  SITE_ADMIN_PASSWORD: change-me
  DB_ROOT_PASSWORD: change-me
  PASSWORD: change-me            # code-server login
---
# Shared by the bootstrap init container and the main container.
apiVersion: v1
kind: ConfigMap
metadata:
  name: frappe-devbox
  namespace: frappe-staging
data:
  SITE_NAME: staging.localhost   # default site; Host header doesn't matter
  CREATE_SITE_ON_FIRST_RUN: "1"
  DEVBOX_INSTALL_APPS: ""        # e.g. "hrms" (app must exist in the bench)
  MARIADB_START_TIMEOUT: "180"
  ENABLE_CODE_SERVER: "1"
  CODE_SERVER_AUTH: password
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: frappe-devbox-data
  namespace: frappe-staging
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi   # local-path does not enforce size; check the node's disk
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frappe-devbox
  namespace: frappe-staging
spec:
  replicas: 1
  strategy:
    type: Recreate   # RWO volume + MariaDB datadir: never two pods at once
  selector:
    matchLabels:
      app: frappe-devbox
  template:
    metadata:
      labels:
        app: frappe-devbox
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 90   # lets supervisord stop MariaDB cleanly
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        # local-path volumes are hostPath-backed, so fsGroup is not applied to
        # them; the provisioner creates the directory 0777, so uid 1000 can
        # write. fsGroup still covers the emptyDirs below.
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # Build/run split: the init container does the slow first-boot work
      # (bench init, yarn install, asset build, new-site) with high limits and
      # exits; the main container then runs with the lower limits. On later
      # restarts the init container finds everything in place and exits in
      # seconds. Scheduling uses the larger of the two requests, so both stay
      # minimal.
      initContainers:
        - name: bootstrap
          image: neuron27/frappe-v15-devbox:0.2.0   # keep in sync with the main container
          # securityContext, envFrom and volumeMounts must match the main container.
          imagePullPolicy: IfNotPresent
          args: ["/bin/true"]   # entrypoint bootstraps, then execs this and exits 0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          envFrom:
            - configMapRef: { name: frappe-devbox }
            - secretRef: { name: frappe-devbox }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
            - { name: home, mountPath: /home/frappe }
          resources:
            requests: { cpu: 250m, memory: 1Gi, ephemeral-storage: 1Gi }
            limits: { cpu: "4", memory: 8Gi, ephemeral-storage: 8Gi }
      containers:
        - name: devbox
          image: neuron27/frappe-v15-devbox:0.2.0   # build/push per README "Build"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          envFrom:
            - configMapRef: { name: frappe-devbox }
            - secretRef: { name: frappe-devbox }
          ports:
            - { name: web, containerPort: 8000 }
            - { name: socketio, containerPort: 9000 }
            - { name: code, containerPort: 8080 }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
            - { name: home, mountPath: /home/frappe }
          # Requests are the minimum an idle devbox needs (MariaDB, Redis,
          # bench start, code-server), so it schedules on a busy node.
          resources:
            requests: { cpu: 250m, memory: 1Gi, ephemeral-storage: 1Gi }
            limits: { cpu: "2", memory: 4Gi, ephemeral-storage: 8Gi }
          startupProbe:          # bootstrap already done by the init container
            tcpSocket: { port: web }
            periodSeconds: 10
            failureThreshold: 60    # ~10 min
          readinessProbe:
            httpGet: { path: /api/method/ping, port: web }
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket: { port: web }
            periodSeconds: 30
            failureThreshold: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: frappe-devbox-data
        - name: tmp
          emptyDir: {}
        - name: home        # caches (uv, yarn, npm); rebuilt on restart
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: frappe-devbox
  namespace: frappe-staging
spec:
  selector:
    app: frappe-devbox
  ports:   # 8080 (code-server) stays private: use kubectl port-forward
    - { name: web, port: 8000, targetPort: web }
    - { name: socketio, port: 9000, targetPort: socketio }
---
# Only Traefik may reach the pod, and only on 8000/9000. Egress stays open:
# bench needs GitHub, PyPI and npm. kubectl port-forward is unaffected.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frappe-devbox
  namespace: frappe-staging
spec:
  podSelector:
    matchLabels:
      app: frappe-devbox
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - { port: 8000, protocol: TCP }
        - { port: 9000, protocol: TCP }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frappe-devbox
  namespace: frappe-staging
spec:
  ingressClassName: traefik
  rules:
    - host: frappe-staging.example.com   # change me
      http:
        paths:
          - path: /socket.io
            pathType: Prefix
            backend:
              service: { name: frappe-devbox, port: { name: socketio } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: frappe-devbox, port: { name: web } }
